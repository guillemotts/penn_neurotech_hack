[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "penn_nh"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "onnxruntime",
    "pytest",
    "pyyaml",
    "matplotlib",
    "scikit-learn",
    "scipy",
    "torch",
]

[tool.hatch.build.targets.wheel]
packages = ["src/penn_nh"]
